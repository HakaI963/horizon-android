name: Android APK

# Nothing Android-related is built locally: cargo cross-compiles the engine for
# aarch64-linux-android here, and Gradle only packages the `.so` into an APK.
on:
  workflow_dispatch:
    inputs:
      ndk:
        description: "Android NDK version to install (blank = newest available)"
        required: false
        default: ""
      api:
        description: "Android API level to link against"
        required: false
        default: "26"
      cargo_profile:
        description: "Cargo profile to build"
        required: false
        default: "fast"
  push:
    branches: [main]
  pull_request:
  # A release calls this workflow for its tag, so the APK a release publishes is
  # built by the same definition CI just tested — not a second copy of it that can
  # drift. `push`/`pull_request`/`workflow_dispatch` behave exactly as before.
  workflow_call:
    inputs:
      ndk:
        description: "Android NDK version to install (blank = newest available)"
        required: false
        type: string
        default: ""
      api:
        description: "Android API level to link against"
        required: false
        type: string
        default: "26"
      cargo_profile:
        description: "Cargo profile to build"
        required: false
        type: string
        default: "fast"
      version_name:
        description: "versionName to put in the APK (blank = 0.1.0-<sha7>)"
        required: false
        type: string
        default: ""
      version_code:
        description: "versionCode to put in the APK (blank = the run number)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Cached artifacts are per-commit here; incremental state would only bloat the runner.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # The engine declares edition 2024 and rust-version 1.90; the runner's own rustc is
  # whatever the image shipped with, so the build pins one instead.
  RUST_TOOLCHAIN: "1.90.0"
  ANDROID_PLATFORM: "35"
  CARGO_TARGET: aarch64-linux-android
  # The Azure application Microsoft sign-in uses. A client ID is public, so it is a
  # repository variable rather than a secret; unset leaves sign-in saying it is not
  # configured, which is the honest answer for a fork that has not registered one.
  HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}

jobs:
  # The engine's own tests are the ones that would have caught the last two
  # mistakes: a `Settings` field added without a default, and a method called from
  # a sibling module without the visibility. Neither needs a phone, a GPU or a
  # window, and both were found only after a nine-minute APK run. This job is the
  # cheap version of that, and it gates the APK like the other checks do.
  #
  # `horizon-android` is excluded: every one of its modules is behind
  # `cfg(target_os = "android")`, so on a host it is an empty crate.
  verify:
    name: engine tests (host)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # `audio` links ALSA and `controllers` links udev on Linux; both are dev
      # packages, and the runner has neither. AGENTS.md says so for a desktop build.
      - name: Install the Linux audio and device libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          # `horizon-mods`'s sandbox tests build their guest modules for wasm32; that
          # is also the crate's real check, per AGENTS.md.
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Cache the crates registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-host-

      # The two wasm guest cdylibs are built for wasm32 and cannot link on the host;
      # their real check is `cargo test -p horizon-mods`, which builds them.
      #
      # `horizon-client` is the point of the job — it is what the APK compiles — and
      # its tests need no GPU, window or network. The whole workspace is asked for so
      # a crate the client depends on cannot break without being seen.
      - name: Test the client, the layout and the engine's own crates
        run: |
          set -euo pipefail
          cargo test --workspace \
            --exclude coords-hud \
            --exclude horizon-mods-test-guest \
            --exclude horizon-android

  # The touch layout is the part of the port a person argues with, and it needs no
  # phone to be wrong: a button that cannot be pressed, a saved layout that does not
  # read back, a drag that turns the camera the wrong way are all questions a host
  # test answers in seconds. The engine and the activity cannot be tested here — the
  # crate that holds them does not even build without an Android target — but this
  # one does, so it is its own crate and its own job.
  model:
    name: touch layout (host tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Test the layout, the hit-testing and the actions
        run: cargo test --package horizon-controls

  # What the engine itself needs before it can run on a phone. `cargo check` is
  # the cheapest way to ask: it compiles every `cfg` for the phone's own target, so
  # each Unix-ism, each crate without an Android backend and each desktop-only API
  # shows up as an error with a file and a line. That list was the porting plan; it
  # is now empty, so the job fails when it is not, and the engine stays honest about
  # compiling by being checked by a real rustc for aarch64-linux-android.
  engine:
    name: engine check (aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install the Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          fi
          NDK="$(ls "$ANDROID_HOME/ndk" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ -z "$NDK" ]; then
            NDK="$("$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list 2>/dev/null \
              | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 | cut -d';' -f2)"
          fi
          test -n "$NDK"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;$NDK" > /dev/null
          LLVM_BIN="$ANDROID_HOME/ndk/$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK"
            echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK"
            echo "CC_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$LLVM_BIN/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$CARGO_TARGET"

      - name: Cache the crates registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ env.CARGO_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ env.CARGO_TARGET }}-

      - name: Check the engine for aarch64-linux-android
        run: |
          # No default features: `controllers` is evdev/libudev and GameInput, which a
          # phone has neither of. `mods` is on, and it is the interpreter-only feature
          # (`horizon-client/mods`): wasmtime's Pulley runs the components without
          # generating any code, which is the only form Android's W^X rule allows. The
          # JIT lives behind `mods-jit` and is desktop-only.
          #
          # The status is captured, not inferred from the log. It used to run under
          # `set +e` and pass or fail on `grep error:`, so a cargo that died of an OOM
          # kill or a missing target printed no `error:` line and the job went green.
          set +e
          cargo check --target "$CARGO_TARGET" --profile fast \
            -p horizon-client --no-default-features --features audio,mods \
            --message-format=short > /tmp/engine.log 2>&1
          status=$?
          set -e
          echo "cargo exit: $status" >> /tmp/engine.log
          {
            echo "## errors, grouped by message"
            grep -E 'error(\[|:)' /tmp/engine.log | sed -E 's/^[^ ]+ +//' | sort | uniq -c | sort -rn | head -60
            echo "## the files that fail"
            grep -oE '^(crates|launcher|third_party)/[^:]+' /tmp/engine.log | sort | uniq -c | sort -rn | head -40
            echo "## first 80 error lines"
            grep -E 'error(\[|:)' /tmp/engine.log | head -80
          } > /tmp/summary.txt || true
          cat /tmp/summary.txt
          tail -30 /tmp/engine.log
          cat /tmp/engine.log /tmp/summary.txt > engine-check.log
          # It used to be a survey: the engine did not compile for a phone at all, and
          # the list of what failed was the porting plan. It compiles now, so a failure
          # here is a regression, and one to hear about in a minute rather than in the
          # APK job six minutes later.
          if [ "$status" -ne 0 ]; then
            echo "::error::the engine does not compile for aarch64-linux-android (cargo exit $status)"
            exit 1
          fi

      - name: Upload the whole check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-check
          path: engine-check.log
          if-no-files-found: ignore

  # The Java exporters and vanilla's data generator need a JVM, and a phone is not
  # going to have one. They are version-pinned and produce the same files for every
  # player, so they run here, once per change to them, and the result rides in the
  # APK as a seed. The launcher downloads the player's client jar from Mojang and
  # combines it with this seed on the phone; the client JAR is never committed or
  # redistributed. See .github/scripts/fetch-minecraft.py and pack-seed.py.
  seed:
    name: minecraft 26.3 seed
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Cache the crates registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-seed-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-seed-

      - name: Cache the prepared seed
        id: seed-cache
        uses: actions/cache@v4
        with:
          path: .ci/seed.zip
          key: minecraft-seed-${{ hashFiles('research-lock.json', 'crates/horizon-core/src/version.rs', 'crates/horizon-prepare/**', 'mods/horizon/src/test/java/**', '.github/scripts/**') }}

      - name: Fetch the pinned Minecraft files
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: python3 .github/scripts/fetch-minecraft.py .ci

      - name: Prepare the resources with JDK 25
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo run --release -p horizon-prepare -- \
            --prepare --minecraft-dir .ci/minecraft --server-jar .ci/server.jar --root .

      - name: Package the seed
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/pack-seed.py \
            .ci/seed.zip .local/horizon-client/26.3 \
            .local/minecraft/26.3/manifest.json

      - name: Check the seed is there
        run: |
          set -euo pipefail
          test -s .ci/seed.zip
          ls -l .ci/seed.zip

      - name: Upload the seed for the APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-seed
          path: .ci/seed.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload the prepare log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-prepare-log
          path: .local/horizon-client/26.3/*.log
          if-no-files-found: ignore

  apk:
    # A static name: `inputs` is empty on a push, and an expression that reads it
    # renders as literal `${{ … }}` in the checks list instead of a job name.
    name: arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The APK is only worth building for a tree that checks. It used to depend on
    # `seed` alone, so a PR that broke the aarch64 engine check or the touch-layout
    # tests still produced a green, downloadable APK.
    needs: [seed, model, engine, verify]
    outputs:
      ndk: ${{ steps.toolchain.outputs.ndk }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the seed prepared for this build
        uses: actions/download-artifact@v4
        with:
          name: horizon-seed
          path: .seed

      - name: Point the native build at the seed
        run: |
          set -euo pipefail
          test -s .seed/seed.zip
          echo "HORIZON_ANDROID_SEED=$PWD/.seed/seed.zip" >> "$GITHUB_ENV"
          ls -l .seed/seed.zip

      # `workflow_dispatch` inputs reach the shell, so they are held in environment
      # variables and checked before anything uses them as a version or a path.
      - name: Check the requested inputs
        env:
          NDK: ${{ inputs.ndk || github.event.inputs.ndk }}
          API: ${{ inputs.api || github.event.inputs.api }}
          PROFILE: ${{ inputs.cargo_profile || github.event.inputs.cargo_profile }}
        run: |
          set -euo pipefail
          [ -z "${NDK:-}" ] || echo "$NDK" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::ndk must look like 28.1.13356706, got '$NDK'"; exit 1; }
          : "${API:=26}"
          echo "$API" | grep -qE '^(2[1-9]|3[0-9])$' \
            || { echo "::error::api must be an Android API level from 21 to 39, got '$API'"; exit 1; }
          : "${PROFILE:=fast}"
          echo "$PROFILE" | grep -qE '^[a-z0-9_-]+$' \
            || { echo "::error::cargo_profile must be a profile name, got '$PROFILE'"; exit 1; }
          echo "API=$API" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "NDK_REQUESTED=$NDK" >> "$GITHUB_ENV"

      - name: Report the toolchain the runner came with
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version 2>&1 | head -1
          echo "ndk dirs already present: $(ls "$ANDROID_HOME/ndk" 2>/dev/null | tr '\n' ' ')"

      - name: Install the Android NDK and the platform Gradle needs
        id: toolchain
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::no sdkmanager in \$ANDROID_HOME ($ANDROID_HOME)"
            exit 1
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true

          # Prefer an NDK the image already has: it is the same compiler, and it
          # saves downloading a package a gigabyte and a half over.
          NDK="$NDK_REQUESTED"
          if [ -z "$NDK" ]; then
            NDK="$(ls "$ANDROID_HOME/ndk" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          fi
          if [ -z "$NDK" ]; then
            NDK="$("$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list 2>/dev/null \
              | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' \
              | sort -V | tail -1 | cut -d';' -f2)"
          fi
          if [ -z "$NDK" ]; then
            echo "::error::could not find an NDK to install"
            exit 1
          fi
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "installing ndk;$NDK, platforms;android-$ANDROID_PLATFORM, build-tools;$ANDROID_PLATFORM.0.0"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "ndk;$NDK" "platforms;android-$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_PLATFORM.0.0" > /dev/null

          NDK_HOME="$ANDROID_HOME/ndk/$NDK"
          LLVM_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$LLVM_BIN/clang++"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> "$GITHUB_ENV"
          # The `cc` crate (android-activity's C glue, imgui-cpp later) looks here.
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "LLVM_BIN=$LLVM_BIN" >> "$GITHUB_ENV"
          echo "installed: $("$LLVM_BIN/clang++" --version | head -1)"

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$CARGO_TARGET"
          rustc --version
          cargo --version

      - name: Point cargo at the NDK's clang
        run: |
          set -euo pipefail
          # The versioned wrappers do two jobs at once: they pass --target=aarch64-linux-android$API
          # (so -D__ANDROID_API__ matches the minSdk, which the C++ and asm dependencies care about)
          # and they link against the right sysroot.
          WRAPPER="$LLVM_BIN/aarch64-linux-android${API}-clang++"
          CC="$LLVM_BIN/aarch64-linux-android${API}-clang"
          if [ ! -x "$WRAPPER" ] || [ ! -x "$CC" ]; then
            echo "::error::$LLVM_BIN has no aarch64-linux-android${API}-clang wrapper"
            ls "$LLVM_BIN" | grep -E '^aarch64-linux-android[0-9]+-clang' | head -20
            exit 1
          fi
          {
            echo "CC_aarch64_linux_android=$CC"
            echo "CXX_aarch64_linux_android=$WRAPPER"
            echo "AR_aarch64_linux_android=$LLVM_BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$WRAPPER"
          } >> "$GITHUB_ENV"
          echo "linker: $WRAPPER (api $API)"

          # rustc learned `-C android-target-api-level` after 1.90 in some distributions and
          # does not know it in others; it only affects which symbols std may reference, and
          # the clang wrappers already cover the C/C++ side, so probe rather than assume.
          printf 'fn main() {}\n' > /tmp/api_probe.rs
          if rustc --target "$CARGO_TARGET" --emit=metadata \
              -C "android-target-api-level=$API" /tmp/api_probe.rs -o /tmp/api_probe.rmeta 2>/dev/null; then
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C android-target-api-level=$API" >> "$GITHUB_ENV"
            echo "rustc accepts -C android-target-api-level"
          else
            echo "rustc has no -C android-target-api-level; relying on the clang wrappers"
          fi

      - name: Cache the crates registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ env.CARGO_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ env.CARGO_TARGET }}-

      - name: Build the engine for ${{ env.CARGO_TARGET }}
        run: |
          set -euo pipefail
          cargo build --target "$CARGO_TARGET" --profile "$CARGO_PROFILE" -p horizon-android
          SO="target/$CARGO_TARGET/$CARGO_PROFILE/libhorizon_android.so"
          ls -l "$SO"
          readelf -h "$SO" | sed -n '1,12p'
          echo "exported entry point:"
          readelf --dyn-syms -W "$SO" | grep -i 'ANativeActivity_onCreate\|android_main'
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$SO" android/app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Package and sign the APK
        working-directory: android
        env:
          # A release passes the tag's own version in; a branch build invents one
          # from the commit, which is what every APK before the first tag carried.
          VERSION_NAME: ${{ inputs.version_name || '' }}
          VERSION_CODE: ${{ inputs.version_code || '' }}
        run: |
          set -euo pipefail
          : "${VERSION_NAME:=0.1.0-${GITHUB_SHA::7}}"
          : "${VERSION_CODE:=$GITHUB_RUN_NUMBER}"
          echo "packaging $VERSION_NAME (versionCode $VERSION_CODE)"
          gradle --no-daemon assembleDebug \
            -PhorizonVersionName="$VERSION_NAME" \
            -PhorizonVersionCode="$VERSION_CODE"

      - name: Report what came out
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          python3 - "$APK" /tmp/from_apk.so <<'PY'
          import sys, zipfile
          apk, out = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              print("entries:", len(names))
              for n in names:
                  if n.endswith(".so") or n.endswith(".dex") or n == "AndroidManifest.xml":
                      print(" ", n, z.getinfo(n).file_size)
              with open(out, "wb") as f:
                  f.write(z.read("lib/arm64-v8a/libhorizon_android.so"))
          PY
          readelf -h /tmp/from_apk.so | sed -n '1,12p'
          echo "minimum Android API the library declares:"
          readelf -p .note.android.ident /tmp/from_apk.so | sed -n '1,16p'

      # A Gradle failure used to leave nothing behind: no report, no log, and the
      # one artifact that would explain it was never uploaded. These run whatever
      # happened, and the APK one is separate so a green build still ships.
      - name: Keep the Gradle logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-android-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The lock file changes as soon as the Android dependencies of winit and wgpu
      # are resolved; keeping it lets the port record exactly what the phone build uses.
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: ignore
