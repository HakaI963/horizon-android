[package]
name = "horizon-controls"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon on Android: the touch control layout, and what a finger on it means"

# Deliberately free of wgpu, winit and imgui: the layout, the hit-testing and the
# action set are the parts worth checking, and a test of them should run on the
# host, where the APK's own crate cannot even be built.
[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }

[lints]
workspace = true
