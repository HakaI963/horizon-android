[package]
name = "horizon-overlay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The imgui layer every platform draws: the touch layout, the panel that changes it, and the frame that paints both"

# Split from `horizon-android` because the engine has to draw this too: the
# controls are useless on a phone unless they are over the world, and the world is
# the engine's. Nothing here knows what a window or an activity is — the platform
# layer owns winit and hands over a render pass, three numbers and some touches.
[dependencies]
log = "0.4"
horizon-controls = { path = "../horizon-controls" }
horizon-imgui = { path = "../horizon-imgui" }
horizon-theme = { path = "../horizon-theme" }
imgui = "0.12"
# The Skins page draws the player from the chosen PNG's own pixels, so it decodes
# one. The engine already carries `png` for the game's textures; this is the same
# crate at the same version.
png = "0.18"
# The phone's feature set, so that building this for the host does not pull in the
# backends a phone has none of.
wgpu = { version = "30.0.1", default-features = false, features = [
    "std",
    "parking_lot",
    "vulkan",
    "wgsl",
] }

[lints]
workspace = true
